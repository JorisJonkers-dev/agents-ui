name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: >-
          Optional absolute URL for the WebView to load. Leave blank to build
          an APK that opens the production app origin.
        required: false
        default: ''
        type: string
  release:
    types: [published]

permissions:
  contents: write
  packages: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CAP_SERVER_URL: ${{ github.event.inputs.server_url || 'https://jorisjonkers.dev' }}

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
      # The action defaults to `packages: tools platform-tools`, and Google has
      # removed the obsolete `tools` package from the SDK repository, so
      # sdkmanager exits 1 with "Failed to find package 'tools'" before any of
      # the build runs. Ask for only what still exists.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm build
      - name: Add Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Opt out of forced edge-to-edge
        working-directory: android
        run: |
          sed -i -E 's/targetSdkVersion = 3[0-9]+/targetSdkVersion = 34/' variables.gradle || true
          cat variables.gradle
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/jorisjonkers.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jorisjonkers-app-apk
          path: dist-apk/jorisjonkers.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to release
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-apk/jorisjonkers.apk --clobber
