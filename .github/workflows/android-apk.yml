name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: >-
          Optional absolute URL for the WebView to load. Leave blank to build
          an APK that opens the production app origin.
        required: false
        default: ''
        type: string
  release:
    types: [published]

permissions:
  contents: write
  packages: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CAP_SERVER_URL: ${{ github.event.inputs.server_url || 'https://jorisjonkers.dev' }}

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm build
      - name: Add Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Opt out of forced edge-to-edge
        working-directory: android
        run: |
          sed -i -E 's/targetSdkVersion = 3[0-9]+/targetSdkVersion = 34/' variables.gradle || true
          cat variables.gradle
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/jorisjonkers.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jorisjonkers-app-apk
          path: dist-apk/jorisjonkers.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to release
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-apk/jorisjonkers.apk --clobber
