name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: mint-app-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: assert-token-minted
        # Fail loudly if the App token is missing — never fall back to GITHUB_TOKEN.
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "E_APP_TOKEN_MISSING: Release App token was not minted." >&2
            echo "Secrets RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY must be configured." >&2
            echo "GITHUB_TOKEN fallback is intentionally forbidden." >&2
            exit 1
          fi
          echo "App token minted successfully (token prefix: ${APP_TOKEN:0:4}...)"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish Container
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish agents-ui image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jorisjonkers-dev/agents-ui:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/jorisjonkers-dev/agents-ui:${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

  native-android:
    name: Android Release Bundle
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
      # The action defaults to `packages: tools platform-tools`, and Google has
      # removed the obsolete `tools` package from the SDK repository, so
      # sdkmanager exits 1 with "Failed to find package 'tools'" before any of
      # the build runs. Ask for only what still exists.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm build
      - name: Add Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build Android release bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Check Android signing secrets
        id: android-signing
        run: echo "has_keystore=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"
      - name: Decode Android keystore
        if: ${{ steps.android-signing.outputs.has_keystore == 'true' }}
        id: android-keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/agents-ui-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
      - name: Sign Android release bundle
        if: ${{ steps.android-signing.outputs.has_keystore == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.android-keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          aab_path="android/app/build/outputs/bundle/release/app-release.aab"
          key_password="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$key_password" "$aab_path" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$aab_path"
      - name: Upload Android release bundle artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agents-ui-android-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
      - name: Check Google Play credentials
        id: google-play
        run: echo "has_credentials=${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload Android release bundle to Google Play internal track
        if: ${{ steps.google-play.outputs.has_credentials == 'true' && steps.android-signing.outputs.has_keystore == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.jorisjonkers.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal

  native-ios:
    name: iOS Simulator Smoke
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm build
      - name: Add iOS project
        run: npx cap add ios
      - name: Sync iOS project
        run: npx cap sync ios
      - name: Build iOS simulator smoke
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build
