# Deploy Preview for deploy-platform service repos.
#
# Any PR touching deploy/ gets a full render + validation and a sticky
# "Deploy Preview" comment with the SC-11 readiness scorecard. The reusable
# deploy-validate.yml workflow owns the gate-summary emission and the comment.
name: Deploy Preview

on:
  pull_request:
    paths:
      - 'deploy/**'

permissions: {}

jobs:
  deploy-preview:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-validate.yml@84587e91c18535949d1c18da3fb7bcc5bcb7085d # v0.11.3
    with:
      deploy-dir: platform
      schema-version: 0.16.0
      image-lock-path: platform/images.lock.json
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:0423d9bcfc091f3b6e9bd6bdd91128bb0278b97e9c9de1907e6b0817c5500232
      environments: production
      comment: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
