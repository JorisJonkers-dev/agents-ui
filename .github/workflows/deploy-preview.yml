# Deploy Preview for deploy-platform service repos.
#
# Any PR touching deploy/ gets a full render + validation and a sticky
# "Deploy Preview" comment with the SC-11 readiness scorecard. The reusable
# deploy-validate.yml workflow owns the gate-summary emission and the comment.
name: Deploy Preview

on:
  pull_request:
    paths:
      - 'deploy/**'

permissions: {}

jobs:
  deploy-preview:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-validate.yml@445bc789871a4486ac83d8d1d4d1e39902f19c2b # v0.11.11
    with:
      deploy-dir: platform
      schema-version: 0.16.0
      image-lock-path: platform/images.lock.json
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:d656ddd8c44e02d6c5087118d7f3d5805183a67ce952ee592448762b908548d9
      environments: production
      comment: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
